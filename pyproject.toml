[project]
name = "halo-dash"
version = "0.1.0"
description = "Monitor for llama-server and LiteLLM on AMD Strix Halo"
readme = "README.md"
authors = [{ name = "Christoph Möller", email = "hallo@network-publishing.de" }]
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "pyyaml>=6",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
halo-dash = "halo_dash.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
